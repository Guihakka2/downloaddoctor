# Builds standalone executables (Node single executable applications) for every GitHub release,
# attaches them to the release with build provenance attestations and a SHA256SUMS.txt.
name: Binaries
on:
  release: { types: [published] }
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: .exe }
          - { os: windows-11-arm, name: windows-arm64, ext: .exe }
          - { os: ubuntu-latest, name: linux-x64, ext: "" }
          - { os: ubuntu-24.04-arm, name: linux-arm64, ext: "" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
          - { os: macos-15-intel, name: macos-x64, ext: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - run: npm test
      - run: node scripts/build-exe.mjs
      - name: smoke test
        shell: bash
        run: |
          test "$(dist/downloaddoctor${{ matrix.ext }} --version)" = "$(node -p "require('./package.json').version")"
          dist/downloaddoctor${{ matrix.ext }} --help | grep -q "Read-only"
      - name: package
        id: pkg
        shell: bash
        env: { NAME: "downloaddoctor-${{ github.event.release.tag_name }}-${{ matrix.name }}" }
        run: |
          mkdir -p out && cp dist/downloaddoctor${{ matrix.ext }} LICENSE README.md out/
          if [ "${{ runner.os }}" = Windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path out/* -DestinationPath '$NAME.zip'"; echo "file=$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$NAME.tar.gz" -C out .; echo "file=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "${{ steps.pkg.outputs.file }}" }
      - name: upload to release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.event.release.tag_name }}", FILE: "${{ steps.pkg.outputs.file }}" }
        run: gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    needs: build
    if: ${{ !cancelled() }} # sums for whatever was built, even if one platform failed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS.txt
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.event.release.tag_name }}" }
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'downloaddoctor-*'
          sha256sum downloaddoctor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
